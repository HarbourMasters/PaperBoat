name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      BUILD_NAME: ${{ needs.build.outputs.build-name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # For libultraship's tools/sign.py; only that submodule is needed.
      - uses: actions/checkout@v6
        with:
          path: source
      - name: Fetch libultraship
        run: git -C source submodule update --init --depth 1 external/libultraship

      # Official mods are signed so PaperBoat loads them without asking. Needs the MOD_SIGNING_KEY secret, a PEM
      # private key whose public key Satella gives the game.
      - name: Build and sign the online example mod
        env:
          MOD_SIGNING_KEY: ${{ secrets.MOD_SIGNING_KEY }}
        run: |
          if [ -z "$MOD_SIGNING_KEY" ]; then
            echo "MOD_SIGNING_KEY is not set; skipping the signed example mod"
            exit 0
          fi
          pip install --quiet cryptography
          unzip -q artifacts/Paperboat-mod-sdk/paperboat-mod-sdk-*.zip -d sdk
          root=$(ls -d sdk/paperboat-mod-sdk-*)
          cmake -S "$root/workspace/online" -B online-build
          cmake --build online-build --target package_mod
          printf '%s' "$MOD_SIGNING_KEY" > signing.pem
          python3 source/external/libultraship/tools/sign.py "$root/workspace/online/PaperBoatOnline.o2r" signing.pem
          rm -f signing.pem
          cp "$root/workspace/online/PaperBoatOnline.o2r" Paperboat-Online-Mod.o2r

      - name: Package and write notes
        run: |
          test -n "$BUILD_NAME"
          prefix="Paperboat-${BUILD_NAME// /-}"
          (cd artifacts/Paperboat-windows && zip -qr "../../$prefix-Win64.zip" .)
          (cd artifacts/Paperboat-linux && zip -qr "../../$prefix-Linux.zip" .)
          (cd artifacts/Paperboat-mac && zip -qr "../../$prefix-Mac.zip" .)
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$prefix"
          cat > notes.md <<EOF
          # Download
          <a href="$url-Win64.zip">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://github.com/HarbourMasters/Shipwright/assets/70942617/8e99955a-03a6-4663-97f2-39704f50a57f">
              <img alt="Windows" src="https://github.com/HarbourMasters/Shipwright/assets/70942617/57cdd3c0-ac25-4909-ac40-edaa68c2c698">
            </picture>
          </a>
          <a href="$url-Linux.zip">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://github.com/HarbourMasters/Shipwright/assets/70942617/32dad2f8-2669-406f-afb4-7264d7257f79">
              <img alt="Linux / Steam Deck" src="https://github.com/HarbourMasters/Shipwright/assets/70942617/74c2ec80-f769-4f54-a1b8-c9bc27e2473a">
            </picture>
          </a>
          <a href="$url-Mac.zip">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://github.com/HarbourMasters/Shipwright/assets/70942617/adacf7bf-19fd-4bdc-b7eb-59a69c52d8b5">
              <img alt="macOS" src="https://github.com/HarbourMasters/Shipwright/assets/70942617/73759976-597b-46c8-8d71-9dc9a2b0e1e3">
            </picture>
          </a>

          ## Biggest Changes:
          <!-- Write these before publishing -->

          EOF

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.BUILD_NAME }} ${{ env.TAG }}
          body_path: notes.md
          files: |
            Paperboat-*.zip
            Paperboat-Online-Mod.o2r
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
