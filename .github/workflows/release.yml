name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform package
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../$name.zip" .)
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          # v1.2.3 is a full release; anything with a suffix (v1.2.3-rc1) is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch' }}
