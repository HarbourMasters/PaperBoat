name: Build

# The port, on every platform it targets. The decomp's own ROM-building
# workflows are the disabled ones in .github/workflows.disabled/.
#
# No job produces paperboat.o2r for the others: the GeneratePortO2R CMake target
# builds it from port/ as part of every build, and the Android APK packs its own
# from the same directory. Nothing here needs a ROM — pm64.o2r is generated on
# the player's own machine, from their own copy.
#
# The Vulkan SDK is deliberately not installed anywhere. libultraship treats it
# as optional (find_package(Vulkan QUIET)) and falls back to OpenGL, Metal or
# DX11, so CI validates the build without paying for the SDK download. Add it to
# the relevant job if you want the Vulkan backend in the artifacts.

# push, not pull_request: every branch in this repo already builds on push, and
# adding pull_request would run the whole six-platform matrix a second time for
# the same commits. A fork's PR does not build automatically — its jobs could
# not reach the signing secrets anyway — so review one with workflow_dispatch.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, so the submodule gitlinks resolve.
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ cmake ninja-build \
            libsdl2-dev libopengl-dev libgl1-mesa-dev \
            libzip-dev nlohmann-json3-dev libtinyxml2-dev libspdlog-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ github.ref }}
          restore-keys: |
            linux-
      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-linux --parallel
      - name: Check the build produced what the game loads
        run: .github/scripts/check-desktop-build.sh build-linux Paperboat
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-linux
          path: |
            build-linux/Paperboat
            build-linux/paperboat.o2r
            build-linux/config.yml
            build-linux/assets

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: brew install ninja sdl2 glew libzip nlohmann-json tinyxml2
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ github.ref }}
          restore-keys: |
            macos-
      - name: Build
        run: |
          cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-macos --parallel
      - name: Check the build produced what the game loads
        run: .github/scripts/check-desktop-build.sh build-macos Paperboat
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-macos
          path: |
            build-macos/Paperboat
            build-macos/paperboat.o2r
            build-macos/config.yml
            build-macos/assets

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # The clang-cl toolchain finds the compiler through vswhere, but Ninja
      # still needs INCLUDE/LIB pointing at the MSVC and Windows SDK headers.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          key: windows-vcpkg-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            windows-vcpkg-${{ github.ref }}
            windows-vcpkg-
          path: ~\AppData\Local\vcpkg\archives
      - name: sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-${{ github.ref }}
          restore-keys: |
            windows-
      - name: Build
        shell: pwsh
        run: |
          # Reuse the runner's preinstalled vcpkg. Blanking VCPKG_ROOT makes
          # automate-vcpkg clone into an empty path instead.
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          # The repo's supported Windows configuration: Ninja + clang-cl.
          cmake --preset windows-release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build --preset windows-release --parallel
      - name: Check the build produced what the game loads
        shell: pwsh
        run: |
          $dir = "build/windows-release"
          foreach ($f in "Paperboat.exe", "paperboat.o2r", "config.yml", "assets") {
            if (-not (Test-Path "$dir/$f")) { throw "$f missing from $dir" }
          }
          Get-Item "$dir/paperboat.o2r" | ForEach-Object {
            if ($_.Length -eq 0) { throw "paperboat.o2r is empty" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-windows
          path: |
            build/windows-release/Paperboat.exe
            build/windows-release/*.dll
            build/windows-release/paperboat.o2r
            build/windows-release/config.yml
            build/windows-release/assets

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # Job-level, because a step's own `env:` is not visible to that step's `if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        # Versions match android/app/build.gradle.kts. libultraship needs
        # CMake >= 3.24, so the NDK's bundled 3.22.1 will not do.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "cmake;3.30.3" "ndk;30.0.15729638" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # Signed with the release key when the secrets are set. Without them the
      # Gradle build falls back to the debug key, so a fork still gets an
      # installable APK instead of a failure on a keystore nobody has.
      # android/app/, not android/: the env-var branch of signingConfigs uses
      # the :app project's file(), which resolves relative to that project dir.
      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || { echo "::error::empty keystore"; exit 1; }
      # Two steps rather than one with a conditional KEYSTORE_FILE: an empty
      # env var is still set, and build.gradle.kts only checks for null, so a
      # blank value would be taken for a configured keystore and fail on
      # file("").
      - name: Build APK (release-signed)
        if: env.KEYSTORE_BASE64 != ''
        run: android/gradlew -p android assembleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Build APK (debug-signed)
        if: env.KEYSTORE_BASE64 == ''
        run: android/gradlew -p android assembleRelease
      - name: Check the APK carries everything the launcher opens
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          # GameAssets.kt opens each of these by name. An APK missing one
          # installs and launches fine, then fails on the device during
          # staging — so catch it here, not after a release goes out.
          for entry in assets/gamedata.zip assets/gamedata.version \
                       assets/gamecontrollerdb.txt assets/mods/place_mods_here.txt \
                       lib/arm64-v8a/libmain.so lib/arm64-v8a/libSDL2.so; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "::error::$entry missing from the APK"; exit 1; }
          done
          cp "$APK" Paperboat.apk
      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-android
          path: Paperboat.apk

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Cache build folder
        uses: actions/cache@v4
        with:
          key: ios-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ios-${{ github.ref }}
            ios-
          path: build-ios
      - name: Build (unsigned, device arm64)
        run: |
          # ios.paperboat.toolchain.cmake, not the upstream ios.toolchain.cmake:
          # it pins the 16.3 deployment target before the toolchain bakes it into
          # the compiler's target triple. See docs/android-ios-web.md.
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.paperboat.toolchain.cmake \
            -DPLATFORM=OS64 -DCMAKE_BUILD_TYPE=Release -DIOS_SIGNING=OFF
          # --target Paperboat skips the dependencies' own side targets.
          cmake --build build-ios --config Release --target Paperboat -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          APP="build-ios/Release-iphoneos/Paperboat.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          # The bundle is where Torch reads its recipes from on device, so a
          # bundle missing them is an IPA that cannot extract a ROM.
          for f in Paperboat paperboat.o2r config.yml assets Info.plist; do
            test -e "$APP/$f" || { echo "::error::$f missing from the app bundle"; exit 1; }
          done
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Paperboat-unsigned.ipa Payload
          cat > SIDELOADING.txt <<'EOF'
          This IPA is UNSIGNED. Install it with a sideloading tool that re-signs
          with your own Apple ID — AltStore, SideStore or Sideloadly.

          Nothing about the game ships inside it. After installing, open the
          Files app and drop your own Paper Mario ROM (baserom.us.z64), or a
          pm64.o2r you generated earlier, into "On My iPhone > Paperboat".
          The app extracts the ROM on first launch.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-ios
          path: |
            Paperboat-unsigned.ipa
            SIDELOADING.txt

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web-${{ github.ref }}
          restore-keys: |
            web-
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.12
          actions-cache-folder: emsdk-cache
      # libzip links against the sysroot's libz.a, and emcc only builds a port
      # the first time something asks for it — which is too late for the
      # find_package(ZLIB) that runs at configure time.
      - name: Build zlib port
        run: embuilder build zlib
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-web --parallel
      - name: Stage site
        run: |
          mkdir site
          for f in paperboat.js paperboat.wasm paperboat.data coi-serviceworker.js; do
            test -s "build-web/$f" || { echo "::error::build-web/$f missing or empty"; exit 1; }
            cp "build-web/$f" site/
          done
          # Both names: index.html is what Pages serves, paperboat.html is what
          # the .js was told its page is called.
          cp build-web/paperboat.html site/paperboat.html
          cp build-web/paperboat.html site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: Paperboat-web
          path: site
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'HarbourMasters/PaperBoat'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'HarbourMasters/PaperBoat'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's rather than add to them, so
    # contents: read is restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Separate from the build concurrency group: cancelling a half-finished
    # deployment leaves the Pages site in whatever state it got to.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
