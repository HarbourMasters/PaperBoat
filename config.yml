# ROM Version Configuration
# This file defines the ROM versions and their properties for the decompilation project

3837f44cda784b466c9a2d99df70d77c322b97a0:
  name: pm64
  path: ./assets/yaml/us
  config:
    gbi: F3DEX2_PM64
    gbi_floats: false
    sort: OFFSET
    logging: WARN
    output:
      binary: pm64.o2r
      headers: include
      code: code

# Romhacks entries go here:
#   <patched ROM SHA1>:
#     name: <Name>                           # shown in menus, stamped into saves
#     path: ./assets/yaml/romhacks/<stem>    # YAML holding only the changed assets
#     romhack:
#       id: <Id>                             # matches specific/<Id>.cpp
#       version: "<version>"
#       author: <Author>                     # optional; written to the manifest
#       description: <one line>              # optional; written to the manifest
#       website: <download page>             # linked from the Supported Romhacks tab
#       works_with: [vanilla]                # optional; what the hack is built on (default vanilla)
#       disable: [<feature id or group.*>]   # optional; port features the hack turns off
#       force: { <feature id>: <value> }     # optional; port features the hack pins to a value
#     config:
#       gbi: F3DEX2_PM64
#       gbi_floats: false
#       sort: OFFSET
#       logging: WARN
#       output:
#         binary: mods/~romhacks/<stem>.o2r
#         headers: include
#         code: code

c02972e81d5f05da7ed0e7b4f0efc30f05a01b18:
  name: Paper Peach
  path: ./assets/yaml/romhacks/paper_peach
  romhack:
    id: PaperPeach
    version: "1.2"
    author: AgateTrevalyn
    description:  Peach embarks on an adventure instead of Mario.
    website: https://gamebanana.com/mods/576687
  config:
    gbi: F3DEX2_PM64
    gbi_floats: false
    sort: OFFSET
    logging: WARN
    output:
      binary: mods/~romhacks/paper_peach.o2r
      headers: include
      code: code


06661190b7a7e2bf1fef0c7fa64274516af84368:
  name: "Paper Mario: TTYD64"
  path: ./assets/yaml/romhacks/ttyd64
  romhack:
    id: TTYD64
    version: "1.0.0"
    author: eldexterr
    description: The Thousand-Year Door remade in the Paper Mario 64 engine.
    website: https://github.com/eldexterr/ttyd64/releases
    disable: [enhancements.no_intro, graphics.status_bar.*]
  config:
    gbi: F3DEX2_PM64
    gbi_floats: false
    sort: OFFSET
    logging: WARN
    output:
      binary: mods/~romhacks/ttyd64.o2r
      headers: include
      code: code
