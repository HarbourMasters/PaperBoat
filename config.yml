# ROM Version Configuration
# This file defines the ROM versions and their properties for the decompilation project

3837f44cda784b466c9a2d99df70d77c322b97a0:
  name: pm64
  path: ./assets/yaml/us
  config:
    gbi: F3DEX2_PM64
    gbi_floats: false
    sort: OFFSET
    logging: WARN
    output:
      binary: pm64.o2r
      headers: include
      code: code

# Romhacks entries go here:
#   <patched ROM SHA1>:
#     name: <Name>                           # shown in menus, stamped into saves
#     path: ./assets/yaml/romhacks/<stem>    # YAML holding only the changed assets
#     romhack:
#       id: <Id>                             # matches specific/<Id>.cpp
#       version: "<version>"
#       url: <download page>                 # linked from the Supported Romhacks tab
#       works_with: [vanilla]                # optional; what the hack is built on (default vanilla)
#       disable: [<feature id or group.*>]   # optional; port features the hack turns off
#       force: { <feature id>: <value> }     # optional; port features the hack pins to a value
#     config:
#       gbi: F3DEX2_PM64
#       gbi_floats: false
#       sort: OFFSET
#       logging: WARN
#       output:
#         binary: mods/~romhacks/<stem>.o2r
#         headers: include
#         code: code

# Paper Peach (gamebanana.com/mods/576687), "Paper Peach Patch.bps" applied to the US ROM
c02972e81d5f05da7ed0e7b4f0efc30f05a01b18:
  name: Paper Peach
  path: ./assets/yaml/romhacks/paper_peach
  romhack:
    id: PaperPeach
    version: "1.2"
    url: https://gamebanana.com/mods/576687
  config:
    gbi: F3DEX2_PM64
    gbi_floats: false
    sort: OFFSET
    logging: WARN
    output:
      binary: mods/~romhacks/paper_peach.o2r
      headers: include
      code: code

