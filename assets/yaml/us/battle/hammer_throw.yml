# battle/move/hammer/hammer_throw overlay
# VRAM base: 0x802A1000, ROM start: 0x752450

:config:
  virtual: [0x802A1000, 0x752450]

# Textures (CI4 32x32 + 16-color palettes)
dusty_hammer:
  { type: TEXTURE, format: CI4, offset: 0x754498, width: 32, height: 32, symbol: battle_move_hammer_throw_dusty_hammer_png }
dusty_hammer.pal:
  { type: TEXTURE, format: TLUT, offset: 0x754698, colors: 16, symbol: battle_move_hammer_throw_dusty_hammer_pal }

basic_hammer:
  { type: TEXTURE, format: CI4, offset: 0x7546B8, width: 32, height: 32, symbol: battle_move_hammer_throw_basic_hammer_png }
basic_hammer.pal:
  { type: TEXTURE, format: TLUT, offset: 0x7548B8, colors: 16, symbol: battle_move_hammer_throw_basic_hammer_pal }

super_hammer:
  { type: TEXTURE, format: CI4, offset: 0x7548D8, width: 32, height: 32, symbol: battle_move_hammer_throw_super_hammer_png }
super_hammer.pal:
  { type: TEXTURE, format: TLUT, offset: 0x754AD8, colors: 16, symbol: battle_move_hammer_throw_super_hammer_pal }

ultra_hammer:
  { type: TEXTURE, format: CI4, offset: 0x754AF8, width: 32, height: 32, symbol: battle_move_hammer_throw_ultra_hammer_png }
ultra_hammer.pal:
  { type: TEXTURE, format: TLUT, offset: 0x754CF8, colors: 16, symbol: battle_move_hammer_throw_ultra_hammer_pal }

# Vertex (4 vertices for textured quad)
hammer_throw_vtx:
  { type: VTX, offset: 0x754D18, count: 4, symbol: battle_move_hammer_throw_vtx }

# Display Lists (each loads a texture + draws the quad)
dusty_hammer_gfx:
  { type: GFX, offset: 0x754D58, symbol: battle_move_hammer_throw_dusty_hammer_gfx }
basic_hammer_gfx:
  { type: GFX, offset: 0x754E48, symbol: battle_move_hammer_throw_basic_hammer_gfx }
super_hammer_gfx:
  { type: GFX, offset: 0x754F38, symbol: battle_move_hammer_throw_super_hammer_gfx }
ultra_hammer_gfx:
  { type: GFX, offset: 0x755028, symbol: battle_move_hammer_throw_ultra_hammer_gfx }
