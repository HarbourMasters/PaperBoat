  { type: TEXTURE, format: CI4, offset: 0x0A000200, width: 32, height: 32, symbol: tex_200 }
tex_400:
  { type: TEXTURE, format: CI4, offset: 0x0A000400, width: 32, height: 32, symbol: tex_400 }

tlut_600:
